    <!-- Open Graph -->

    <!-- Twitter -->

    <link rel="preload" as="image" href="/media/hero-figure-1280.webp" type="image/webp" fetchpriority="high" />

    <!--
      The first screen must stay impressive even without JS: this static
      fallback paints the near-black canvas + the poster image immediately.
    -->
    <style>
      html { background: #0A0A0A; }
      body { margin: 0; background: #0A0A0A; color: #F5F5F7; }
      /* Attractive, brand-true loading state: poster plate + wordmark.
         It is removed the moment the hero reports its first painted frame. */
      #boot-veil {
        position: fixed;
        inset: 0;
        z-index: 999;
        display: grid;
        place-items: center;
        background: #0A0A0A url("/media/hero-poster.jpg") center 38% / cover no-repeat;
        transition: opacity 900ms cubic-bezier(0.16, 1, 0.3, 1);
      }
      #boot-veil::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(120% 90% at 50% 42%, rgba(10, 10, 10, 0.35) 0%, rgba(10, 10, 10, 0.82) 60%, #0A0A0A 100%);
      }
      #boot-veil.is-out { opacity: 0; pointer-events: none; }
      .boot-inner { position: relative; z-index: 1; text-align: center; padding: 0 6vw; }
      .boot-word {
        font-family: Anton, "Arial Black", Helvetica, sans-serif;
        text-transform: uppercase;
        font-size: clamp(1.6rem, 6vw, 3.4rem);
        letter-spacing: -0.02em;
        line-height: 0.9;
        margin: 0;
      }
      .boot-sub {
        margin: 1.1rem 0 0;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.62rem;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        color: #8b8578;
      }
      .boot-bar {
        margin: 1.75rem auto 0;
        width: min(220px, 46vw);
        height: 1px;
        background: rgba(245, 245, 247, 0.18);
        overflow: hidden;
      }
      .boot-bar span {
        display: block;
        height: 100%;
        width: 40%;
        background: #F5F5F7;
        animation: boot-slide 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes boot-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(250%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-veil { transition: none; }
        .boot-bar span { animation: none; width: 100%; }
      }
    </style>
    <script>
      document.documentElement.classList.remove('no-js');
      document.documentElement.classList.add('js');
    </script>
  </head>
  <body>
    <div id="boot-veil" role="status" aria-live="polite" aria-label="Loading Faith Over Fear RW">
      <div class="boot-inner">
        <p class="boot-word">Faith Over Fear</p>
        <p class="boot-sub">Kigali · Rwanda</p>
        <div class="boot-bar"><span></span></div>
      </div>
    </div>
    <div id="root"></div>
    <noscript>
      <div style="padding: 12vh 6vw; font-family: Helvetica, Arial, sans-serif; max-width: 46rem">
        <p style="letter-spacing: 0.42em; font-size: 0.7rem; color: #8b8578">FAITH OVER FEAR RW</p>
        <h1 style="font-size: clamp(2.4rem, 9vw, 5rem); line-height: 0.92; letter-spacing: -0.03em; margin: 0.4em 0">
          WALK BY FAITH.<br />LIVE WITHOUT FEAR.
        </h1>
        <p style="color: #b8b2a6; max-width: 34rem; line-height: 1.6">
          Faith-inspired streetwear from Kigali, Rwanda. Every piece carries a message. Every stitch
          represents a stand.
        </p>
        <p>
          <a href="https://faithoverfearrw.netlify.app/shop" style="color: #F5F5F7; border: 1px solid #4a463f; padding: 0.85em 1.6em; text-decoration: none; letter-spacing: 0.22em; font-size: 0.72rem; display: inline-block">
            SHOP THE COLLECTION

        </p>
        <p style="color: #8b8578; font-size: 0.85rem">
          Contact
          <a href="mailto:faithoverfearsupport@gmail.com" style="color: #F5F5F7">faithoverfearsupport@gmail.com</a>

          ·

        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
